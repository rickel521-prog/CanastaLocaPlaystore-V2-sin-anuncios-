<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canasta Loca</title>
<style>
:root{--bg:#10162f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162f}}
:root[data-theme="dark"]{--bg:#10162f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const W=360,H=640,FLOOR=H-40,BX=100,FONT='system-ui,Segoe UI,Roboto,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1;
function rs(){const d=window.devicePixelRatio||1;S=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.width=W*S*d;cv.height=H*S*d;ctx.setTransform(S*d,0,0,S*d,0,0);}
addEventListener('resize',rs);rs();

const BALLS=[
 {k:'basket',n:'Basquet',d:'Equilibrada, la de siempre',g:1500,j:-470,b:.7,r:16,c:'#f97316'},
 {k:'globo',n:'Globo',d:'Ligero: cae lento, rebota poco',g:650,j:-300,b:.5,r:19,c:'#38bdf8'},
 {k:'bolo',n:'Bolo',d:'Pesado: cae rápido, salta fuerte',g:2300,j:-640,b:.3,r:15,c:'#a78bfa'}];
const COL={fixed:'#ef4444',move:'#22c55e',pulse:'#06b6d4',gold:'#facc15'};
let best=0;try{best=+localStorage.getItem('cl_best')||0}catch(e){}
let st='menu',ball,hoops=[],score=0,lives=3,combo=0,spd=140,t=0,overT=0,pops=[],inv=0,flash=0;

function start(i){ball={x:BX,y:260,vy:0,rot:0,B:BALLS[i]};hoops=[];pops=[];score=0;lives=3;combo=0;spd=140;t=0;inv=0;flash=0;spawn(W+60);st='play';}
function spawn(x){
 let ty='fixed';
 if(score>=3){const r=Math.random();ty=r<.3?'move':r<.55?'pulse':r<.75?'gold':'fixed';}
 hoops.push({x,y0:230+Math.random()*190,y:300,w:ty==='gold'?62:84,ty,ph:Math.random()*6,done:0,touched:0});
}
function endGame(){st='over';overT=0;if(score>best){best=score;try{localStorage.setItem('cl_best',best)}catch(e){}}}
function pop(txt,x,y,c){pops.push({txt,x,y,t:0,c:c||'#fff'});}

function upd(dt){
 t+=dt;spd=Math.min(230,140+t*1.5);
 const B=ball.B,py=ball.y;
 ball.vy+=B.g*dt;ball.y+=ball.vy*dt;ball.rot+=dt*3;
 if(inv>0)inv-=dt;if(flash>0)flash-=dt;
 if(ball.y+B.r>FLOOR){
  if(inv<=0){
   lives--;combo=0;flash=.35;inv=1.6;
   pop('¡Tocó el piso!',W/2,FLOOR-60,'#fca5a5');
   if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
   if(lives<=0){endGame();return;}
   ball.y=260;ball.vy=0;
  }else{ball.y=FLOOR-B.r;ball.vy=-Math.abs(ball.vy)*B.b;if(Math.abs(ball.vy)<60)ball.vy=0;}
 }
 if(ball.y-B.r<0){ball.y=B.r;ball.vy=Math.abs(ball.vy)*.3;}
 if(hoops[hoops.length-1].x<W-250)spawn(W+70);
 for(const h of hoops){
  h.x-=spd*dt;h.ph+=dt*2;
  if(h.ty==='move')h.y=h.y0+Math.sin(h.ph)*70;
  else if(h.ty==='gold')h.y=h.y0+Math.sin(h.ph*1.3)*40;
  else if(h.ty==='pulse'){h.y=h.y0;h.w=84+Math.sin(h.ph*1.5)*24;}
  else h.y=h.y0;
  for(const s of [-1,1]){
   const rx=h.x+s*h.w/2,dx=ball.x-rx,dy=ball.y-h.y,m=B.r+5;
   if(Math.hypot(dx,dy)<m){
    const sg=dy<0?-1:1;
    ball.y=h.y+sg*Math.sqrt(Math.max(0,m*m-dx*dx));
    if(ball.vy*sg<0)ball.vy=-ball.vy*B.b;
    h.touched=1;
   }
  }
  if(!h.done&&py<=h.y&&ball.y>h.y&&ball.vy>0&&Math.abs(ball.x-h.x)<h.w/2-4){
   h.done=1;
   combo=h.touched?0:combo+1;
   const mult=1+Math.min(Math.floor(combo/3),4),pts=(h.ty==='gold'?3:1)*mult;
   score+=pts;
   pop(h.touched?'+'+pts:'¡Limpia! +'+pts,h.x,h.y-30,h.ty==='gold'?'#facc15':'#fff');
   if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  }
  if(!h.done&&h.x+h.w/2<ball.x-B.r){
   h.done=2;lives--;combo=0;pop('¡Fallaste!',ball.x+40,ball.y-20,'#fca5a5');
   if(lives<=0)endGame();
  }
 }
 hoops=hoops.filter(h=>h.x>-80);
 for(const p of pops){p.t+=dt;p.y-=30*dt;}
 pops=pops.filter(p=>p.t<1);
}

function txt(s,x,y,size,c,al,w){ctx.fillStyle=c;ctx.font=(w||'700')+' '+size+'px '+FONT;ctx.textAlign=al||'center';ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=4;ctx.fillText(s,x,y);ctx.shadowBlur=0;}
function drawBall(x,y,r,rot,B){
 const T=performance.now()/1000;let g;
 ctx.save();ctx.translate(x,y);
 if(B.k==='globo'){
  ctx.rotate(Math.sin(T*2.2)*.12);
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,r*1.3);
  for(let i=1;i<=9;i++)ctx.lineTo(Math.sin(T*5+i)*3*(i/9),r*1.3+i*r*.14);
  ctx.stroke();
  g=ctx.createRadialGradient(-r*.35,-r*.45,r*.1,0,0,r*1.15);
  g.addColorStop(0,'#e0f2fe');g.addColorStop(.5,'#38bdf8');g.addColorStop(1,'#0369a1');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,r,r*1.1,0,0,7);ctx.fill();
  ctx.fillStyle='#0284c7';ctx.beginPath();ctx.moveTo(0,r*1.06);ctx.lineTo(-r*.2,r*1.32);ctx.lineTo(r*.2,r*1.32);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-r*.42,-r*.48,r*.16,r*.3,-.5,0,7);ctx.fill();
 }else if(B.k==='bolo'){
  ctx.rotate(rot);
  g=ctx.createRadialGradient(-r*.4,-r*.45,r*.1,0,0,r);
  g.addColorStop(0,'#c4b5fd');g.addColorStop(.45,'#7c3aed');g.addColorStop(1,'#2e1065');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='#0f0720';
  for(const [hx,hy,hr] of [[-.24,-.42,.13],[.14,-.5,.13],[-.05,-.1,.16]]){ctx.beginPath();ctx.arc(hx*r,hy*r,hr*r,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(-r*.42,r*.15,r*.1,r*.2,.6,0,7);ctx.fill();
 }else{
  ctx.rotate(rot);
  g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);
  g.addColorStop(0,'#fdba74');g.addColorStop(.55,'#f97316');g.addColorStop(1,'#9a3412');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
  ctx.strokeStyle='#431407';ctx.lineWidth=Math.max(1.4,r*.1);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();
  ctx.beginPath();ctx.arc(-r*1.55,0,r*1.2,-.75,.75);ctx.stroke();
  ctx.beginPath();ctx.arc(r*1.55,0,r*1.2,Math.PI-.75,Math.PI+.75);ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='#431407';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.ellipse(-r*.4,-r*.45,r*.2,r*.12,-.7,0,7);ctx.fill();
 }
 ctx.restore();
}
function heart(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.8,y-s*1.2,x,y-s*.4);ctx.bezierCurveTo(x+s*.8,y-s*1.2,x+s*1.6,y-s*.2,x,y+s*.9);ctx.fill();}
function drawHoop(h){
 const hw=h.w/2;
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;
 for(let i=0;i<=4;i++){ctx.beginPath();ctx.moveTo(h.x-hw+i*h.w/4,h.y);ctx.lineTo(h.x-hw*.6+i*h.w*.6/4,h.y+34);ctx.stroke();}
 ctx.beginPath();ctx.moveTo(h.x-hw*.6,h.y+34);ctx.lineTo(h.x+hw*.6,h.y+34);ctx.stroke();
 ctx.strokeStyle=COL[h.ty];ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(h.x-hw,h.y);ctx.lineTo(h.x+hw,h.y);ctx.stroke();
 if(h.ty==='gold')txt('x3',h.x,h.y-12,14,'#facc15');
}
function drawMenu(){
 txt('Canasta Loca',W/2,110,40,'#fff');
 txt('Toca para impulsar la bola y mételá por el aro',W/2,142,14,'#c7d2fe','center','400');
 txt('cayendo desde arriba. Elige tu bola:',W/2,162,14,'#c7d2fe','center','400');
 BALLS.forEach((B,i)=>{
  const y=210+i*110;
  ctx.fillStyle='rgba(15,23,42,.6)';ctx.beginPath();ctx.roundRect(24,y,W-48,90,16);ctx.fill();
  drawBall(70,y+45,B.r+6,performance.now()/900,B);
  txt(B.n,112,y+40,22,'#fff','left');
  txt(B.d,112,y+64,13,'#c7d2fe','left','400');
 });
 txt('Mejor puntaje: '+best,W/2,FLOOR+26,16,'#fde68a');
}
function drawHud(){
 txt(score,W/2,70,56,'#fff');
 for(let i=0;i<3;i++)heart(28+i*30,32,11,i<lives?'#f87171':'rgba(255,255,255,.22)');
 if(flash>0){ctx.fillStyle='rgba(239,68,68,'+(flash/.35*.35)+')';ctx.fillRect(0,0,W,H);}
 const mult=1+Math.min(Math.floor(combo/3),4);
 if(mult>1)txt('x'+mult+' combo',W-16,36,18,'#fde68a','right');
 if(t<4)txt('Toca para impulsar · ¡no toques el piso!',W/2,FLOOR-70,15,'rgba(255,255,255,.8)','center','500');
 for(const p of pops){ctx.globalAlpha=1-p.t;txt(p.txt,p.x,p.y,18,p.c);ctx.globalAlpha=1;}
}
function drawOver(){
 ctx.fillStyle='rgba(15,23,42,.75)';ctx.fillRect(0,0,W,H);
 txt('Fin del juego',W/2,230,34,'#fff');
 txt(score+' puntos',W/2,290,26,'#fde68a');
 txt('Mejor: '+best,W/2,325,16,'#c7d2fe','center','500');
 if(overT>.5)txt('Toca para jugar de nuevo',W/2,400,18,'#fff','center','500');
}
function draw(){
 drawBg(st==='menu'?-1:BALLS.indexOf(ball.B));
 if(st==='menu'){drawMenu();return;}
 hoops.forEach(drawHoop);
 if(inv>0&&st==='play')ctx.globalAlpha=Math.floor(performance.now()/90)%2?.35:1;
 drawBall(ball.x,ball.y,ball.B.r,ball.rot,ball.B);ctx.globalAlpha=1;
 drawHud();
 if(st==='over')drawOver();
}
function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.85)';for(const [dx,dy,r] of [[0,0,16],[18,-6,20],[40,0,15],[20,6,14]]){ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,7);ctx.fill();}}
function drawBg(k){
 const T=performance.now()/1000,g=ctx.createLinearGradient(0,0,0,H);
 const P=[['#1e3a8a','#6d28d9'],['#1b1035','#4c1d95'],['#38bdf8','#fde68a'],['#0b0620','#701a75']][k+1];
 g.addColorStop(0,P[0]);g.addColorStop(1,P[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 let fl='#78350f',ed='#b45309';
 if(k===0){
  for(const x of [70,180,290]){const o=Math.sin(T+x)*20;ctx.fillStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-60+o,FLOOR);ctx.lineTo(x+60+o,FLOOR);ctx.fill();}
  for(let r=0;r<5;r++)for(let i=0;i<24;i++){ctx.fillStyle='hsl('+((i*37+r*60)%360)+',55%,'+(28+r*3)+'%)';ctx.beginPath();ctx.arc(i*16+(r%2)*8,FLOOR-170+r*18+Math.sin(T*3+i)*1.5,6,0,7);ctx.fill();}
  ctx.fillStyle='rgba(27,16,53,.5)';ctx.fillRect(0,FLOOR-190,W,190);
  fl='#c2410c';ed='#fff';
 }else if(k===1){
  ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(290,110,38,0,7);ctx.fill();
  for(let i=0;i<5;i++)cloud(((i*140-T*18)%700+700)%700-70,70+i*80,.8+i%2*.3);
  ctx.fillStyle='#86efac';ctx.beginPath();ctx.ellipse(80,FLOOR,170,90,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#4ade80';ctx.beginPath();ctx.ellipse(280,FLOOR,190,60,0,Math.PI,0);ctx.fill();
  fl='#16a34a';ed='#bbf7d0';
 }else if(k===2){
  for(let i=0;i<7;i++){const x=30+i*50,y=FLOOR-70-(i%2)*24;ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(x,y,12,22,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(x,y-28,8,0,7);ctx.fill();}
  ctx.lineWidth=2;for(let i=0;i<6;i++){const y=(i*90+T*40)%540;ctx.strokeStyle='rgba(244,114,182,.18)';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  fl='#d6a15c';ed='#f472b6';
 }
 ctx.fillStyle=fl;ctx.fillRect(0,FLOOR,W,H-FLOOR);
 if(k===0||k===2){ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;for(let x=0;x<W;x+=(k?60:24)){ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x,H);ctx.stroke();}}
 ctx.fillStyle=ed;ctx.fillRect(0,FLOOR,W,5);
}
let last=0;
function loop(ts){
 const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
 if(st==='play')upd(dt);else if(st==='over')overT+=dt;
 draw();requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(st==='play'){ball.vy=ball.B.j;return;}
 if(st==='over'){if(overT>.5)st='menu';return;}
 const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/S;
 const i=Math.floor((y-210)/110);
 if(i>=0&&i<3&&y<210+i*110+90)start(i);
});
requestAnimationFrame(loop);
</script></body></html>
